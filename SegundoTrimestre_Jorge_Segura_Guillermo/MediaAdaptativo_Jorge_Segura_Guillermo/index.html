<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo con @media</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .contenedor {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .segundocontenedor {
            position: relative;
            width: 500px;
            height: 500px;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .2);
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
        }

        .etiqueta-texto {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 15px;
            text-align: center;
            background: black;
            color: white;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 22px;
            font-weight: 700;
            width: fit-content;
            margin: 0 auto;
        }

        @media screen and (max-width: 600px) {
            body {
                background-image: url(./images/Estadio1.jpg);
                background-repeat: no-repeat;
                background-size: cover;
            }
        }

        @media screen and (min-width: 601px) and (max-width: 1200px) {
            body {
                background-image: url(./images/Estadio2.jpg);
                background-repeat: no-repeat;
                background-size: cover;
            }
        }

        @media screen and (min-width: 1201px) {
            body {
                background-image: url(./images/Estadio3.jpg);
                background-repeat: no-repeat;
                background-size: cover;
            }
        }

        .segundocontenedor {
            background-image: url("./images/gento-padre.jpg");
        }

        .etiqueta-texto::after {
            content: "Pantalla grande";
        }

        @media screen and (max-width: 600px) {
            .segundocontenedor {
                background-image: url("./images/CR7.png");
            }

            .etiqueta-texto::after {
                content: "Pantalla pequeña";
            }
        }

        @media screen and (min-width: 601px) and (max-width: 1200px) {
            .segundocontenedor {
                background-image: url("./images/Mbappe.png");
            }

            .etiqueta-texto::after {
                content: "Pantalla mediana";
            }
        }

        .boton-volver-flotante {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #5c3a21;
            color: #f1c40f;
            text-decoration: none;
            padding: 12px 20px;
            border: 4px solid #8b5a2b;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            box-shadow: 4px 4px 0px #000;
            z-index: 100;
        }
        .boton-volver-flotante:hover { background-color: #6d4a2d; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <div class="contenedor">
        <div class="segundocontenedor">
            <div class="etiqueta-texto"></div>
        </div>
    </div>
    
    <a href="../index.html" class="boton-volver-flotante">Volver al Mapa</a>
</body>

</html>
