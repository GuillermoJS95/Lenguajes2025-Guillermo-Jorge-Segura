<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Guillermo Jorge Segura">
    <title>Página Web Guillermo Jorge Segura</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Press Start 2P', monospace;
            background-color: #1a1a1a;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-image: url(./images/wood_texture.png);
            background-color: #2b1b17;
            border-bottom: 6px solid #1a0f08;
            color: #f1c40f;
            text-align: center;
            padding: 10px 0;
            text-shadow: 3px 3px 0 #000;
            box-shadow: inset 0px -6px 0px rgba(0, 0, 0, 0.4), inset 0px 6px 0px rgba(255, 255, 255, 0.1);
        }

        header h3 {
            font-size: 1.5em;
            margin: 15px 0;
            line-height: 1.5;
        }

        img {
            width: 100%;
            max-width: 300px;
            height: auto;
            aspect-ratio: 1;
            border-radius: 8px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 215, 0, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            image-rendering: pixelated;
        }

        .t1-bloque {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .t1-bloque img {
            max-width: 280px;
            width: 95%;
        }

        .trimestres-container {
            background-color: transparent;
            display: flex;
            width: 100%;
        }

        .trimestres-container .trimestre {
            background-image: url(./images/wood_texture.png);
            background-color: #3e2723;
            color: #f1c40f;
            text-shadow: 2px 2px 0 #000;
            font-size: 10px;
            padding: 20px;
            border: 6px solid #1a0f08;
            border-bottom: none;
            box-shadow: inset 4px 4px 0px rgba(255, 255, 255, 0.1), inset -4px 0px 0px rgba(0, 0, 0, 0.4);
            margin: 0;
            line-height: 1.8;
        }

        .columnas-container {
            display: flex;
            width: 100%;
            flex-grow: 1;
        }

        .columnas-container .trimestre {
            border: 6px solid #1a0f08;
            border-top: none;
            border-right: none;
        }

        .columnas-container .trimestre:last-child {
            border-right: 6px solid #1a0f08;
        }

        .trimestre {
            flex: 1;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.95), inset 4px 0 0 rgba(255, 255, 255, 0.05), inset -4px -4px 0 rgba(0, 0, 0, 0.4);
        }

        .trimestre1 {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url(./images/fondo_trimestre_1.png);
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            gap: 20px;
        }

        .trimestre2 {
            background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url(./images/fondo_trimestre_2.png);
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            gap: 20px;
        }

        .trimestre3 {
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url(./images/fondo_trimestre_3.png);
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            gap: 20px;
        }

        .btn-retro {
            display: inline-block;
            background-color: #5c3a21;
            color: #f1c40f;
            text-decoration: none;
            padding: 8px 12px;
            border: 3px solid #8b5a2b;
            box-shadow: 3px 3px 0px #000;
            font-size: 8px;
            text-shadow: 2px 2px 0px #000;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-t1 {
            background-color: #0d2840;
            border-color: #1c5588;
            color: #7ebaf2;
        }

        .btn-t2 {
            background-color: #0d3824;
            border-color: #1a7c49;
            color: #79f2b8;
        }

        .btn-t3 {
            background-color: #3b0a0a;
            border-color: #9c2a11;
            color: #ff9d00;
        }

        .btn-retro:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }

        .btn-retro:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }

        footer {
            background-image: url(./images/wood_texture.png);
            background-color: #2b1b17;
            border-top: 6px solid #1a0f08;
            color: #f1c40f;
            padding: 20px 0;
            text-align: center;
            font-size: 10px;
            text-shadow: 2px 2px 0 #000;
            box-shadow: inset 0px 6px 0px rgba(255, 255, 255, 0.1), inset 0px -6px 0px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body>

    <header>
        <h3>Index Guillermo Jorge Segura</h3>
    </header>
    <div class="trimestres-container">
        <h2 class="trimestre">Primer Trimestre</h2>
        <h2 class="trimestre">Segundo Trimestre</h2>
        <h2 class="trimestre">Tercer Trimestre</h2>
    </div>
    <main class="columnas-container">

        <div class="trimestre trimestre1">
            <div class="t1-bloque">
                <img src="./images/web_individual.png" alt="Pagina Web Individual Guillermo">
                <a href="./Web_1erTrimestre_JorgeSegura_Guillermo/index.html" class="btn-retro btn-t1">WEB INDIVIDUAL</a>
            </div>
            <div class="t1-bloque">
                <img src="./images/web_chuches.png" alt="Pagina WebJam Chuches">
                <a href="./PrimerTrimestre_Jorge_Segura_Guillermo/WebJamChuches_Jorge_Segura_Guillermo/index.html" class="btn-retro btn-t1">WEBJAM CHUCHES</a>
            </div>
        </div>

        <div class="trimestre trimestre2">
            <img src="./images/segundo_trimestre.png" alt="Pagina Segundo Trimestre">
            <a href="./SegundoTrimestre_Jorge_Segura_Guillermo/index.html" class="btn-retro btn-t2">ENTRAR T2</a>
        </div>

        <div class="trimestre trimestre3">
            <img src="./images/tercer_trimestre.png" alt="Pagina Tercer Trimestre">
            <a href="#" class="btn-retro btn-t3" style="opacity: 0.6; cursor: not-allowed;">PROXIMAMENTE</a>
        </div>

    </main>

    <footer>
        <p>Guillermo Jorge Segura. Index para Lenguaje de Marcas.</p>
    </footer>

</body>

</html>
